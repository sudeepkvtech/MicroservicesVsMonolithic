# Docker Compose configuration for Monolithic Application
# Defines all services needed to run the application

version: '3.8'

# Services definition
services:
  # PostgreSQL Database
  # Design Pattern: Service Container Pattern
  # - Each service runs in its own container
  postgres:
    # Official PostgreSQL image
    image: postgres:15-alpine
    # Container name for easy reference
    container_name: appointment-postgres
    # Environment variables for PostgreSQL
    environment:
      # Database name
      POSTGRES_DB: appointment_db
      # Database username
      POSTGRES_USER: postgres
      # Database password (in production, use secrets)
      POSTGRES_PASSWORD: postgres
    # Port mapping: host_port:container_port
    # 5432 is PostgreSQL default port
    ports:
      - "5432:5432"
    # Volume for data persistence
    # Design Pattern: Volume Mounting
    # - Data persists even if container is removed
    # - Prevents data loss on container restart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Health check for database
    healthcheck:
      # Check if PostgreSQL is accepting connections
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Restart policy
    restart: unless-stopped
    # Network configuration
    networks:
      - appointment-network

  # Spring Boot Application
  app:
    # Build from Dockerfile in current directory
    build:
      context: .
      dockerfile: Dockerfile
    # Container name
    container_name: appointment-monolithic
    # Port mapping
    ports:
      - "8080:8080"
    # Environment variables for Spring Boot
    environment:
      # Database connection URL
      # Uses service name 'postgres' as hostname (Docker DNS)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appointment_db
      # Database credentials
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Active Spring profile
      SPRING_PROFILES_ACTIVE: dev
      # JVM memory settings
      JAVA_OPTS: -Xmx512m -Xms256m
    # Depends on PostgreSQL
    # Design Pattern: Dependency Management
    # - Ensures PostgreSQL starts before app
    # - Waits for PostgreSQL to be healthy
    depends_on:
      postgres:
        condition: service_healthy
    # Restart policy
    restart: unless-stopped
    # Network configuration
    networks:
      - appointment-network

# Volumes definition
# Persistent storage for database data
volumes:
  postgres_data:
    # Named volume managed by Docker
    driver: local

# Networks definition
# Custom network for service communication
networks:
  appointment-network:
    # Bridge driver (default)
    # - Containers can communicate using service names
    # - Isolated from other Docker networks
    driver: bridge

# Usage:
# Start all services: docker-compose up -d
# Stop all services: docker-compose down
# View logs: docker-compose logs -f
# Restart app: docker-compose restart app
# Remove all (including volumes): docker-compose down -v
